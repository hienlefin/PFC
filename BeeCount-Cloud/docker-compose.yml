services:
  beecount-cloud:
    image: sunxiao0721/beecount-cloud:latest
    restart: unless-stopped
    ports:
      - "8869:8080"
    volumes:
      - ./data:/data
    environment:
      TZ: Asia/Ho_Chi_Minh
      BOOTSTRAP_ADMIN_EMAIL: admin@local.dev
      BOOTSTRAP_ADMIN_PASSWORD: BeeCount123!
