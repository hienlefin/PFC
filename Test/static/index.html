<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VN30F Backtest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="bg"></div>
  <main class="shell">
    <header class="hero">
      <p class="brand">VN30F Lab</p>
      <h1>Backtest phái sinh</h1>
      <p class="lede">Chọn mô hình, chạy trên dữ liệu hợp đồng gần nhất và xem kết quả đầu tư.</p>
    </header>

    <section class="controls" aria-label="Chọn chiến lược">
      <label for="strategy">Mô hình</label>
      <div class="control-row">
        <select id="strategy" name="strategy"></select>
        <button id="runBtn" type="button">Chạy backtest</button>
      </div>
      <p id="strategyDesc" class="desc"></p>
    </section>

    <p id="status" class="status" hidden></p>

    <section id="results" class="results" hidden>
      <div class="metrics" id="metrics"></div>
      <figure class="chart-wrap">
        <img id="chart" alt="Biểu đồ backtest" />
      </figure>
      <div class="table-wrap">
        <h2>Danh sách lệnh</h2>
        <table>
          <thead>
            <tr>
              <th>Vào</th>
              <th>Ra</th>
              <th>Hướng</th>
              <th>Entry</th>
              <th>Exit</th>
              <th>Điểm</th>
              <th>Net PnL</th>
            </tr>
          </thead>
          <tbody id="tradesBody"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
